{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="se-page-header">
    <h2>Configuración del sistema</h2>
    <p style="color: var(--text-secondary); margin: 0;">Edita los horarios comerciales, IVA y umbrales de bonos.</p>
</div>

<form method="POST" class="se-card">
    {% csrf_token %}
    <div class="se-card-body">
        <div class="se-form-grid">
            <div class="se-col-6 se-form-group">
                <label class="se-form-label">Nombre del Sistema</label>
                <input type="text" name="nombre_sistema" class="se-form-control" value="{{ config.nombre_sistema }}" required>
            </div>
            <div class="se-col-3 se-form-group">
                <label class="se-form-label">Hora de Apertura</label>
                <input type="text" name="hora_apertura" class="se-form-control" placeholder="08:00" pattern="^([01]\d|2[0-3]):[0-5]\d$" title="Formato 24h: HH:MM, por ejemplo 08:00" value="{{ config.hora_apertura|time:'H:i' }}" required>
            </div>
            <div class="se-col-3 se-form-group">
                <label class="se-form-label">Hora de Cierre</label>
                <input type="text" name="hora_cierre" class="se-form-control" placeholder="22:00" pattern="^([01]\d|2[0-3]):[0-5]\d$" title="Formato 24h: HH:MM, por ejemplo 22:00" value="{{ config.hora_cierre|time:'H:i' }}" required>
            </div>
            <div class="se-col-4 se-form-group">
                <label class="se-form-label">Porcentaje IVA</label>
                <input type="number" step="0.01" name="porcentaje_iva" class="se-form-control" value="{{ config.porcentaje_iva }}" required>
            </div>
            <div class="se-col-4 se-form-group">
                <label class="se-form-label">Umbral para Bonos ($)</label>
                <input type="number" step="0.01" name="umbral_bonos" class="se-form-control" value="{{ config.umbral_bonos }}" required>
            </div>
            <div class="se-col-4 se-form-group">
                <label class="se-form-label">Última Actualización</label>
                <input type="text" class="se-form-control se-readonly-field" value="{{ config.fecha_actualizacion|date:'Y-m-d H:i' }}" disabled>
            </div>
        </div>
        <div class="se-form-actions">
            <button type="submit" class="se-btn se-btn-primary">💾 Guardar Cambios</button>
        </div>
    </div>
</form>

{% endblock %}
