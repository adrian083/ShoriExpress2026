{% extends 'base.html' %}

{% block content %}
<div class="se-form-card">
    <div class="se-form-header">
        <h3>{% if recibo %}Editar{% else %}Generar Nuevo{% endif %} Recibo</h3>
    </div>
    <div class="se-form-body">
        <form method="POST" id="reciboForm">
            {% csrf_token %}
            <div class="se-form-grid">
                <div class="se-col-6 se-form-group">
                    <label class="se-form-label" for="id_pedido">Asociar Pedido *</label>
                    <select name="id_pedido" id="id_pedido" class="se-form-control" required>
                        <option value="">--- Seleccione un pedido ---</option>
                        {% for p in pedidos %}
                        <option value="{{ p.id }}"
                            {% if recibo.pedido.id == p.id %}selected{% endif %}>
                            Pedido #{{ p.id }} - {{ p.usuario.primer_nombre }} (Total: ${{ p.total_pedido }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="se-col-6 se-form-group">
                    <label class="se-form-label" for="id_metodo_pago">Método de Pago *</label>
                    <select name="id_metodo_pago" id="id_metodo_pago" class="se-form-control" required>
                        <option value="">--- Seleccione método ---</option>
                        {% for m in metodos %}
                        <option value="{{ m.id }}"
                            {% if recibo.metodo_pago.id == m.id %}selected{% endif %}>
                            {{ m.nombre_metodo }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="se-col-12">
                    <hr class="se-form-divider" style="margin: 10px 0; border: 0; border-top: 1px solid var(--border-color);">
                </div>

                <div class="se-col-4 se-form-group">
                    <label class="se-form-label" for="subtotal">Subtotal ($) *</label>
                    <input type="number" step="0.01" id="subtotal" name="subtotal" class="se-form-control"
                           value="{{ recibo.subtotal|stringformat:'.2f'|default:'' }}" required min="0">
                </div>
                <div class="se-col-4 se-form-group">
                    <label class="se-form-label" for="iva_total">IVA Total ($)</label>
                    <input type="number" step="0.01" id="iva_total" name="iva_total" class="se-form-control"
                           value="{{ recibo.iva_total|stringformat:'.2f'|default:'0.00' }}" min="0">
                </div>
                <div class="se-col-4 se-form-group">
                    <label class="se-form-label" for="total">Total Pagado ($) *</label>
                    <input type="number" step="0.01" id="total" name="total" class="se-form-control"
                           value="{{ recibo.total_pagado|stringformat:'.2f'|default:'' }}" required
                           style="border-color: var(--accent-blue, #3b82f6); font-weight: 700; background: var(--bg-main);" readonly>
                    <small class="se-form-hint">Calculado automáticamente.</small>
                </div>

                <div class="se-col-12 se-form-group">
                    <label class="se-form-label" for="puntos_ganados">Bonos ganados (campo recibo)</label>
                    <input type="number" id="puntos_ganados" name="puntos_ganados" class="se-form-control"
                           value="{{ recibo.puntos_ganados|default:0 }}" min="0">
                    <span class="se-form-hint">Al guardar, si es &gt; 0 se suman bonos al cliente. Compras ≥ $50.000 suelen sumar 1 bono.</span>
                </div>
            </div>

            <div class="se-form-actions" style="margin-top: 20px;">
                <a href="{% url 'lista_recibos' %}" class="se-btn se-btn-outline">Cancelar</a>
                <button type="submit" class="se-btn se-btn-success se-btn-lg">
                    {% if recibo %}Actualizar{% else %}Finalizar y Guardar{% endif %} Recibo
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const subtotalInput = document.getElementById('subtotal');
    const ivaInput = document.getElementById('iva_total');
    const totalInput = document.getElementById('total');

    // Función para calcular el total automáticamente
    function calcularTotal() {
        const subtotal = parseFloat(subtotalInput.value) || 0;
        const iva = parseFloat(ivaInput.value) || 0;
        totalInput.value = (subtotal + iva).toFixed(2);
    }

    subtotalInput.addEventListener('input', calcularTotal);
    ivaInput.addEventListener('input', calcularTotal);

    // Validación al enviar
    document.getElementById('reciboForm').addEventListener('submit', function(e) {
        const total = parseFloat(totalInput.value);
        if (total <= 0) {
            alert("El total del recibo debe ser mayor a cero.");
            e.preventDefault();
        }
    });
</script>
{% endblock %}
