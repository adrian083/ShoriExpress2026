{% extends 'base.html' %}

{% block content %}
<div class="se-confirm-card">
    <div class="se-confirm-header">
        <div class="confirm-icon">⚠️</div>
        <h4>Anular Recibo</h4>
    </div>
    <div class="se-confirm-body">
        <p>¿Deseas eliminar permanentemente el recibo:</p>
        <p><strong class="text-brand" style="font-size:1.2rem;">{{ recibo.numero_recibo }}</strong></p>
        <p class="text-muted small">Esto no afectará los datos del pedido original.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="se-confirm-actions">
                <button type="submit" class="se-btn se-btn-danger">Confirmar Eliminación</button>
                <a href="{% url 'lista_recibos' %}" class="se-btn se-btn-outline">Volver</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
