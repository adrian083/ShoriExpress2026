{% extends 'base.html' %}

{% block content %}
<div class="se-confirm-card">
    <div class="se-confirm-header">
        <div class="confirm-icon">⚠️</div>
        <h4>¿Eliminar Insumo?</h4>
    </div>
    <div class="se-confirm-body">
        <p>¿Estás seguro de que deseas eliminar <strong>{{ insumo.nombre_insumo }}</strong>?</p>
        <p class="text-muted small">Esta acción no se puede deshacer.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="se-confirm-actions">
                <button type="submit" class="se-btn se-btn-danger">Eliminar</button>
                <a href="{% url 'lista_inventario' %}" class="se-btn se-btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
